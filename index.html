<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parallel Reader</title>
<style>
:root {
  --bg: #f4f1ea; --panel: #fffdf8; --ink: #1f1d1a; --muted: #6b665d; --line: #e2dccf;
  --hl: rgba(255, 196, 0, .38); --hl-strong: rgba(255, 170, 0, .55); --pin: rgba(64, 140, 255, .30);
  --word: rgba(64, 140, 255, .35); --phrase: #3d7be0; --shadow: 0 10px 32px rgba(20,30,60,.28);
  --pop-bg: #eef2fb; --pop-ink: #172034; --pop-muted: #56627c; --pop-line: #c6d0e8; --pop-head: #2f5bd3; --pop-soft: #dfe7fa;
  --c0: #d0552b; --c1: #2f8f5b; --c2: #7a4fd0; --c3: #c0880c; --c4: #1f8fb0; --c5: #b03a7a;
  --accent: #8a5a00; --doubt: #c2410c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15140f; --panel: #1d1c17; --ink: #ece7dc; --muted: #9b958a; --line: #34322b;
    --hl: rgba(255, 196, 0, .28); --hl-strong: rgba(255, 180, 0, .45); --pin: rgba(90, 160, 255, .30);
    --word: rgba(90, 160, 255, .38); --phrase: #7fb0ff; --shadow: 0 10px 32px rgba(0,0,0,.7);
    --pop-bg: #172033; --pop-ink: #e6ecf8; --pop-muted: #97a4bd; --pop-line: #2d3d5a; --pop-head: #3a66d8; --pop-soft: #1f2b44;
    --c0: #ff8a5c; --c1: #5fd394; --c2: #b394ff; --c3: #f2c14e; --c4: #5ccfee; --c5: #f07ab8;
    --accent: #f0b84a; --doubt: #f07a3c;
  }
}
:root[data-theme="dark"] {
  --bg: #15140f; --panel: #1d1c17; --ink: #ece7dc; --muted: #9b958a; --line: #34322b;
  --hl: rgba(255, 196, 0, .28); --hl-strong: rgba(255, 180, 0, .45); --pin: rgba(90, 160, 255, .30);
  --word: rgba(90, 160, 255, .38); --phrase: #7fb0ff; --shadow: 0 10px 32px rgba(0,0,0,.7);
  --pop-bg: #172033; --pop-ink: #e6ecf8; --pop-muted: #97a4bd; --pop-line: #2d3d5a; --pop-head: #3a66d8; --pop-soft: #1f2b44;
  --c0: #ff8a5c; --c1: #5fd394; --c2: #b394ff; --c3: #f2c14e; --c4: #5ccfee; --c5: #f07ab8;
  --accent: #f0b84a; --doubt: #f07a3c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 16px/1.6 Georgia, "Iowan Old Style", "Palatino Linotype", serif; }
header { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; padding: 10px 16px;
  border-bottom: 1px solid var(--line); font-family: system-ui, sans-serif; font-size: 14px; }
header h1 { font-size: 17px; margin: 0; }
header .meta { color: var(--muted); }
header .spacer { flex: 1; }
@media (min-width: 1000px) {  /* one header row on desktop: the book meta gives way first */
  header { flex-wrap: nowrap; }
  header > * { flex-shrink: 0; white-space: nowrap; }
  header .meta { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
}
header label { color: var(--muted); }
header a { color: var(--accent); font-weight: 600; text-decoration: none; }
header a:hover { text-decoration: underline; }
header a.support { padding: 1px 11px; border: 1px solid var(--accent); border-radius: 99px; font-size: 13px; }
header a.support:hover { text-decoration: none; background: var(--accent); color: var(--bg); }
header a.about { padding: 1px 11px; border: 1px solid var(--line); border-radius: 99px; font-size: 13px; color: var(--ink); }
header a.about:hover { text-decoration: none; border-color: var(--accent); }
#aboutDlg { max-width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 64px); padding: 0; border: 1px solid var(--line);
  border-radius: 12px; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
#aboutDlg::backdrop { background: rgba(0, 0, 0, .45); }
#aboutDlg .in { padding: 18px 22px 20px; }
#aboutDlg h2 { margin: 0 0 10px; font-size: 1.3em; }
#aboutDlg h3 { margin: 18px 0 6px; font-size: 1.05em; }
#aboutDlg p { margin: 0 0 10px; }
#aboutDlg a { color: var(--accent); font-weight: 600; }
#aboutDlg .x { position: sticky; top: 0; float: right; margin: 8px 8px 0 0; border: 0; background: transparent; font-size: 20px;
  line-height: 1; cursor: pointer; color: var(--muted); }
#aboutDlg .muted { color: var(--muted); font: 13px/1.5 system-ui, sans-serif; }
select, button { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 8px; }
body { display: flex; flex-direction: column; }  /* header may wrap on narrow screens; panels take the rest */
main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); flex: 1; min-height: 0; }
.col { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.col:last-child { border-right: 0; }
.col h2 { margin: 0; padding: 6px 16px; font: 600 12px/1.6 system-ui, sans-serif; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
.scroll { overflow-y: auto; padding: 16px; min-height: 0; flex: 1; scroll-behavior: smooth; }
/* scan */
.page { position: relative; margin: 0 auto 16px; max-width: 640px; background: var(--panel);
  box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.page img { display: block; width: 100%; height: auto; }
.page .no { position: absolute; top: 4px; right: 8px; font: 11px system-ui; color: var(--muted); }
.rg { position: absolute; border-radius: 3px; cursor: pointer; mix-blend-mode: multiply; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rg { mix-blend-mode: normal; } }
:root[data-theme="dark"] .rg { mix-blend-mode: normal; }
/* text */
.text { max-width: 640px; margin: 0 auto; }
.text h3 { font-size: 1.25em; margin: 1.2em 0 .4em; }
.text h4 { font-size: 1.05em; margin: 1em 0 .3em; }
.text p { margin: 0 0 .8em; text-indent: 1.4em; hyphens: auto; }
.s { border-radius: 3px; cursor: pointer; transition: background .08s; }
.hl { background: var(--hl); }
.rg.hl { background: var(--hl-strong); }
.pin { background: var(--pin) !important; }
.empty { color: var(--muted); font-style: italic; }
.cap { margin: -4px 10px 14px; color: var(--muted); font: italic 13px/1.4 system-ui, sans-serif; text-align: center; }
/* reader notes: small badge after a sentence; "?" = open doubt (asks readers for help), "i" = editorial note */
.nm { display: inline-block; min-width: 15px; height: 15px; margin: 0 1px 0 3px; padding: 0 3px; vertical-align: 5px;
  border: 1px solid var(--muted); border-radius: 99px; background: var(--panel); color: var(--muted); text-indent: 0;
  font: 700 10px/13px system-ui, sans-serif; font-style: normal; text-align: center; cursor: pointer; }
.nm:hover { border-color: var(--phrase); color: var(--phrase); }
.nm.q { background: var(--doubt); border-color: var(--doubt); color: #fff; }
.nm.q:hover { filter: brightness(1.12); color: #fff; }
.nm:focus-visible { outline: 2px solid var(--phrase); outline-offset: 1px; }
/* grammar: words, phrases, clauses */
.w { border-radius: 2px; }
body.alt .w, body.gmode .w { cursor: help; }
body.alt .w:hover, body.gmode .w:hover { box-shadow: inset 0 -2px var(--phrase); }
.w.wsel { background: var(--word); }
.w.wphr { box-shadow: inset 0 -2px var(--phrase); }
.w[data-c] { text-decoration: underline 2px; text-underline-offset: 4px; }
.w[data-c="0"] { text-decoration-color: var(--c0); } .w[data-c="1"] { text-decoration-color: var(--c1); }
.w[data-c="2"] { text-decoration-color: var(--c2); } .w[data-c="3"] { text-decoration-color: var(--c3); }
.w[data-c="4"] { text-decoration-color: var(--c4); } .w[data-c="5"] { text-decoration-color: var(--c5); }
.w.wv { font-weight: 700; }
/* grammar card: cool blue "sheet" with a header strip, so it never reads as part of the warm page text */
#pop { position: fixed; z-index: 10; display: none; width: min(420px, calc(100vw - 32px)); max-height: 65vh;
  overflow-y: auto; padding: 0; background: var(--pop-bg); color: var(--pop-ink); border: 1px solid var(--pop-line);
  border-radius: 10px; box-shadow: var(--shadow), 0 0 0 3px var(--pop-soft); font: 13.5px/1.5 system-ui, sans-serif; }
#pop.on { display: block; }
#pop .kind { position: sticky; top: 0; display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 14px;
  background: var(--pop-head); color: #fff; font: 600 11px/1.6 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
#pop .kind span { flex: 1; }
#pop .kind button { border: 0; background: transparent; color: #fff; font-size: 16px; line-height: 1; padding: 0 4px; cursor: pointer; }
#pop .bd { padding: 10px 14px 12px; }
#pop .hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
#pop .hd b { font: 700 19px/1.3 Georgia, serif; }
#pop .lemma { color: var(--pop-muted); }
#pop .gl { margin: 0 0 6px; font: 600 16px/1.35 system-ui, sans-serif; }
#pop .cl .gl { margin: 2px 0 0; font-size: 13.5px; }
#pop .rep { color: var(--doubt); font-weight: 600; text-decoration: none; }
#pop .rep:hover { text-decoration: underline; }
#pop .plonly { margin: 8px 0 0; font-size: 12px; color: var(--pop-muted); font-style: italic; }
#pop .lit { margin: 0 0 8px; padding: 6px 9px; background: var(--pop-soft); border-radius: 4px; }
/* sentence card, word by word: each German word with its short Polish meaning underneath, underlined in its
   clause's colour (the full meaning is in the Alt+click word card) */
#pop .il { display: flex; flex-wrap: wrap; gap: 6px 4px; margin: 0 0 10px; }
#pop .il span:hover { background: var(--pop-soft); border-radius: 3px; cursor: pointer; }
#pop .dot { color: var(--pop-muted); font-weight: 400; }
#pop .parts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 0 0 8px; padding: 6px 9px;
  background: var(--pop-soft); border-radius: 4px; }
#pop .parts b { font: 600 15px/1.35 Georgia, serif; }
#pop .kind .back { margin-right: auto; margin-left: 10px; padding: 0 8px; font-size: 12px; }
#pop .il span { display: inline-flex; flex-direction: column; align-items: center; padding: 0 2px 1px;
  border-bottom: 2px solid transparent; }
#pop .il b { font: 600 15px/1.25 Georgia, serif; }
#pop .il b.v { color: var(--pop-head); }
#pop .il small { max-width: 8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: 11.5px/1.2 system-ui, sans-serif; color: var(--pop-muted); }
#pop .il span[data-c="0"] { border-color: var(--c0); } #pop .il span[data-c="1"] { border-color: var(--c1); }
#pop .il span[data-c="2"] { border-color: var(--c2); } #pop .il span[data-c="3"] { border-color: var(--c3); }
#pop .il span[data-c="4"] { border-color: var(--c4); } #pop .il span[data-c="5"] { border-color: var(--c5); }
#pop.stuck .kind span::after { content: " · " attr(data-stuck); font-weight: 400; opacity: .8; }
#pop .tag { font-size: 11.5px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--pop-line); color: var(--pop-muted); }
#pop .tag.k { color: #fff; background: var(--pop-head); border-color: var(--pop-head); }
#pop dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 6px 0 0; }
#pop dt { color: var(--pop-muted); }
#pop dd { margin: 0; }
#pop .box { margin-top: 8px; padding: 6px 9px; border-left: 3px solid var(--phrase); background: var(--pop-soft); border-radius: 4px; }
#pop .cl { margin-top: 7px; padding-left: 9px; border-left: 3px solid var(--pop-muted); }
#pop .cl[data-c="0"] { border-color: var(--c0); } #pop .cl[data-c="1"] { border-color: var(--c1); }
#pop .cl[data-c="2"] { border-color: var(--c2); } #pop .cl[data-c="3"] { border-color: var(--c3); }
#pop .cl[data-c="4"] { border-color: var(--c4); } #pop .cl[data-c="5"] { border-color: var(--c5); }
#pop .cl i { font-family: Georgia, serif; }
#pop .muted { color: var(--pop-muted); }
#pop kbd { border-color: var(--pop-line); }
#pop ul { margin: 6px 0 0; padding-left: 18px; }
#pop .note { margin-top: 8px; padding: 6px 9px; border-left: 3px solid var(--pop-muted); background: var(--pop-soft); border-radius: 4px; }
#pop .note.q { border-left-color: var(--doubt); }
#pop .note .tag { margin-right: 4px; }
#pop .note p { margin: 4px 0 0; }
#pop .tag.q { color: #fff; background: var(--doubt); border-color: var(--doubt); }
#pop .fb { display: inline-block; margin-top: 7px; padding: 2px 10px; border-radius: 6px; background: var(--doubt); color: #fff;
  font-weight: 600; text-decoration: none; }
#pop .fb:hover { filter: brightness(1.12); }
footer.hint { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); font: 12px system-ui;
  color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px;
  white-space: nowrap; }
kbd { font: 11px system-ui; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  .col { border-right: 0; border-bottom: 1px solid var(--line); }
  .scroll { max-height: 70vh; }
  footer.hint { display: none; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">…</h1><span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <label><span data-i="lang"></span> <select id="lang"><option value="pl">polski</option><option value="en">English</option></select></label>
  <label data-i-title="gmodeTip"><input type="checkbox" id="gmode"> <span data-i="gmode"></span></label>
  <label><input type="checkbox" id="sync" checked> <span data-i="sync"></span></label>
  <a id="report" target="_blank" rel="noopener" hidden data-i="report" data-i-title="reportTip"></a>
  <a id="about" class="about" href="#about" data-i="about"></a>
  <a id="support" class="support" target="_blank" rel="noopener" hidden data-i="support"></a>
</header>
<main>
  <section class="col"><h2 data-i="colScan"></h2><div class="scroll" id="scan"></div></section>
  <section class="col"><h2 data-i="colSrc"></h2><div class="scroll"><div class="text" id="src"></div></div></section>
  <section class="col"><h2 id="trh">Tłumaczenie</h2><div class="scroll"><div class="text" id="tr"></div></div></section>
</main>
<div id="pop" role="dialog" aria-live="polite"></div>
<footer class="hint" data-i-html="hint"></footer>
<dialog id="aboutDlg"><button type="button" class="x" data-i-aria="close" onclick="this.closest('dialog').close()">×</button><div class="in" id="aboutBody"></div></dialog>
<script>
const params = new URLSearchParams(location.search);
const bookId = params.get("book") || "sagen-posen";
const $ = (id) => document.getElementById(id);
let book, byId, pinned = null, hovered = null, hoverEl = null, scrollTimer = null;
let popKind = null, popKey = null, popAnchor = null, popStuck = false, popBeside = false, popBack = null; // kind: "word" | "sentence" | "notes"

// ---- interface language: follows the translation language (PL / EN); the first visit takes the browser's language ----
const UI = {
  pl: {
    lang: "Tłumaczenie", gmode: "gramatyka po kliknięciu", gmodeTip: "Klik na słowo w wersji cyfrowej pokazuje gramatykę (bez Alt, np. na telefonie)",
    sync: "przewijaj razem", report: "Zgłoś błąd", reportTip: "Błąd w konkretnym zdaniu zgłosisz najszybciej z karty zdania (Ctrl+klik)", reportHere: "Zgłoś błąd w tym zdaniu",
    about: "O projekcie", support: "☕ Postaw kawę", close: "Zamknij",
    colScan: "Oryginał (skan)", colSrc: "Oryginał — wersja cyfrowa", colTr: "Tłumaczenie", page: "s.", pageAlt: "Strona",
    hint: "Najedź: zdanie we wszystkich panelach · <kbd>Ctrl</kbd>+najedź: zdanie słowo po słowie (<kbd>Ctrl</kbd>+klik: przypnij) · <kbd>Alt</kbd>+klik na słowo: gramatyka słowa · klik na <b>?</b>/<b>i</b>: uwagi",
    noTr: "[brak tłumaczenia]", word: "Gramatyka · słowo", sentence: "Gramatyka · zdanie", notes: "Uwagi redakcji",
    back: "← zdanie", stuck: "przypięte (Esc zamyka)", details: "kliknij: szczegóły", literal: "Dosłownie:",
    form: "Forma", why: "Dlaczego", forms: "Odmiana", formation: "Budowa", related: "Skojarzenia", old: "Dawniej",
    wholeSentence: "Całe zdanie: przytrzymaj <kbd>Ctrl</kbd> i najedź.", noGrammar: "Brak opisu gramatyki dla tego zdania.",
    plOnly: "", like: "jak", langs: { "ang.": "angielskie", "pol.": "polskie", "łac.": "łacińskie", "fr.": "francuskie", "gr.": "greckie" },
    doubt: "wątpliwość", remark: "uwaga", answer: "Znasz odpowiedź? Zgłoś",
    doubtTip: "Wątpliwość — kliknij, żeby zobaczyć i pomóc", remarkTip: "Uwaga redakcji — kliknij, żeby zobaczyć",
    kinds: { transcription: "transkrypcja", translation: "tłumaczenie", grammar: "gramatyka" },
    fbTitle: "Uwaga czytelnika", fbError: "Błąd", fbSentence: "Zdanie", fbOriginal: "Oryginał", fbTranslation: "Tłumaczenie",
    fbNote: "Uwaga", fbWhat: "**Co jest nie tak?** (transkrypcja / tłumaczenie / gramatyka)", fbAnswer: "**Moja odpowiedź:**",
    aboutHtml: (b) => `<h2>O projekcie</h2>
<p>To projekt robiony dla frajdy. Autor tego czytnika chciał przeczytać <i>${b.title}</i>, zbiór podań z dawnego
Poznańskiego, który w ${b.year} r. spisał ${b.author}, ale nie zna niemieckiego na tyle, żeby swobodnie czytać oryginał.
A nie chciał stracić niuansów, które daje dopiero patrzenie na oryginał: stary druk i prawdziwe słowa podań.</p>
<p>Dlatego czytnik pokazuje obok siebie skan, tekst i tłumaczenie, a karta zdania (przytrzymaj <b>Ctrl</b> i najedź na zdanie)
tłumaczy je słowo po słowie i rozkłada długie słowa na części. Da się czytać oryginał, nawet nie znając języka.</p>
<p>Transkrypcję, tłumaczenia i opisy gramatyczne przygotowują agenci AI. Błędy się zdarzają: przycisk „Zgłoś błąd” w nagłówku bardzo pomaga.</p>
<h3>Masz starą książkę?</h3>
<p>Jeśli masz albo znasz stare książki w domenie publicznej, chętnie dodam kolejne, szczególnie regionalny folklor, podania
i legendy, także z innych krajów i kultur.${b.propose_url ? ` <a href="${esc(b.propose_url)}" target="_blank" rel="noopener">Zaproponuj książkę</a>.` : ""}</p>
${b.support_url ? `<p>Jeśli czytnik Ci się przydał, możesz <a href="${esc(b.support_url)}" target="_blank" rel="noopener">postawić kawę</a>.</p>` : ""}
<p class="muted">W czytniku: ${b.pages} stron skanu, ${b.sentences} zdań. ${esc(b.license)}.</p>`,
  },
  en: {
    lang: "Translation", gmode: "grammar on click", gmodeTip: "A click on a word in the digital text shows its grammar (no Alt needed, e.g. on a phone)",
    sync: "scroll together", report: "Report an error", reportTip: "For an error in one sentence, use the sentence card (Ctrl+click)", reportHere: "Report an error in this sentence",
    about: "About", support: "☕ Buy me a coffee", close: "Close",
    colScan: "Original (scan)", colSrc: "Original — digital text", colTr: "Translation", page: "p.", pageAlt: "Page",
    hint: "Hover: the sentence in all panels · <kbd>Ctrl</kbd>+hover: the sentence word by word (<kbd>Ctrl</kbd>+click: pin) · <kbd>Alt</kbd>+click a word: its grammar · click <b>?</b>/<b>i</b>: notes",
    noTr: "[no translation yet]", word: "Grammar · word", sentence: "Grammar · sentence", notes: "Editor's notes",
    back: "← sentence", stuck: "pinned (Esc closes)", details: "click: details", literal: "Word for word:",
    form: "Form", why: "Why", forms: "Paradigm", formation: "Structure", related: "Related", old: "Older use",
    wholeSentence: "The whole sentence: hold <kbd>Ctrl</kbd> and hover.", noGrammar: "No grammar notes for this sentence yet.",
    plOnly: "The grammar notes and word meanings are in Polish for now.", like: "cf.",
    langs: { "ang.": "English", "pol.": "Polish", "łac.": "Latin", "fr.": "French", "gr.": "Greek" },
    doubt: "open question", remark: "note", answer: "Know the answer? Tell us",
    doubtTip: "Open question — click to see it and help", remarkTip: "Editor's note — click to see it",
    kinds: { transcription: "transcription", translation: "translation", grammar: "grammar" },
    fbTitle: "Reader note", fbError: "Error", fbSentence: "Sentence", fbOriginal: "Original", fbTranslation: "Translation",
    fbNote: "Note", fbWhat: "**What is wrong?** (transcription / translation / grammar)", fbAnswer: "**My answer:**",
    aboutHtml: (b) => `<h2>About</h2>
<p>This is a project made for fun. The author of this reader wanted to read <i>${b.title}</i>, folk legends from the old
Province of Posen collected by ${b.author} in ${b.year}, but doesn't know German well enough to read the original with
ease, and didn't want to lose the nuance that only comes from the original: the old print and the legends' own words.</p>
<p>So the reader puts the scan, the text and a translation side by side, and the sentence card (hold <b>Ctrl</b> and hover

    `<div class="hd">${[st.tense, st.mood, st.voice].filter(Boolean).map(x => `<span class="tag k">${esc(L(x))}</span>`).join("")}` +
    `${st.type ? `<span class="tag">${esc(L(st.type))}</span>` : ""}</div>` + il +
    (st.literal ? `<div class="lit"><b>${t("literal")}</b> ${esc(L(st.literal, s.src))}</div>` : "") +
    (st.summary ? `<div>${esc(L(st.summary))}</div>` : "") +
    clauses.map((c, ci) => {
      const words = [];
      for (const [a, z] of c.w) for (let i = a; i <= z; i++) words.push(i);
      const txt = words.map(i => inRanges(i, c.verb) ? `<b>${esc(wordText(s, i))}</b>` : esc(wordText(s, i))).join(" ");
      return `<div class="cl" data-c="${ci % 6}"><span class="muted">${esc(L(c.type))}</span><br><i>${txt}</i>` +
        `${c.gloss ? `<div class="gl">→ ${esc(L(c.gloss))}</div>` : ""}` +
        `${c.note ? `<br>${esc(L(c.note))}` : ""}</div>`;
    }).join("") +
    (st.notes && st.notes.length ? `<ul>${st.notes.map(n => `<li>${esc(L(n))}</li>`).join("")}</ul>` : "") + plOnly() +
    (book.book.feedback_url ? `<p style="margin:10px 0 0"><a class="rep" href="${esc(feedbackHref(book.book.feedback_url, s))}"` +
      ` target="_blank" rel="noopener" onclick="track('report', { sid: '${sid}' })">${t("reportHere")}</a></p>` : "");
  openPop("sentence", sid, html, anchor);
  srcWords(sid).forEach((n, i) => {
    const ci = clauses.findIndex(c => inRanges(i, c.w));
    if (ci >= 0) { n.dataset.c = ci % 6; if (inRanges(i, clauses[ci].verb)) n.classList.add("wv"); }
  });
}

// ---- reader notes (books/<id>/notes.json): editorial remarks and open doubts readers can answer ----
const pageOf = (s) => s.regions.length ? s.regions[0].page : "?";

function noteMark(s) {
  const q = s.notes.some(n => n.doubt), b = document.createElement("button");
  b.type = "button"; b.className = q ? "nm q" : "nm"; b.textContent = q ? "?" : "i";
  b.title = q ? t("doubtTip") : t("remarkTip");
  b.setAttribute("aria-label", b.title);
  return b;
}

// fills {title} and {body} in book.feedback_url (e.g. a GitHub "new issue" link), URL-encoded;
// s = the sentence (optional), n = the note being answered (optional)
function feedbackHref(tpl, s, n) {
  let title = t("fbTitle"), body = `${t("fbWhat")}\n\n`;
  if (s) {
    const lang = $("lang").value, tr = s[lang] != null ? lang : "pl";
    title = `${n ? t("fbTitle") : t("fbError")}: ${s.id}`;
    body = [
      `**${t("fbSentence")}:** ${s.id} (${book.book.title}, ${t("page")} ${pageOf(s)})`,
      `**${t("fbOriginal")}:** ${s.src}`,
      s[tr] != null ? `**${t("fbTranslation")} (${tr.toUpperCase()}):** ${s[tr]}` : null,
      n ? `**${t("fbNote")} (${ui().kinds[n.kind] || n.kind}):** ${(lang === "en" && n.en) || n.pl}` : null,
      "", n ? t("fbAnswer") : t("fbWhat"), "", "",
    ].filter(l => l !== null).join("\n");
  }
  return tpl.split("{title}").join(encodeURIComponent(title)).split("{body}").join(encodeURIComponent(body));
}

function showNotes(el) {
  if (popKind === "notes" && popAnchor === el) { hidePop(); return; }  // second click on the same badge closes
  const s = byId[el.closest("[data-sid]").dataset.sid];
  if (!s || !s.notes) return;
  const lang = $("lang").value, url = book.book.feedback_url;
  const html = `<div class="hd"><b>${esc(s.id)}</b><span class="tag">${t("page")} ${esc(pageOf(s))}</span></div>` +
    s.notes.map(n =>
      `<div class="note${n.doubt ? " q" : ""}"><span class="tag${n.doubt ? " q" : ""}">${n.doubt ? t("doubt") : t("remark")}</span>` +
      `<span class="tag">${esc(ui().kinds[n.kind] || n.kind)}</span><p>${esc((lang === "en" && n.en) || n.pl)}</p>` +
      (n.doubt && url ? `<a class="fb" href="${esc(feedbackHref(url, s, n))}" target="_blank" rel="noopener">${t("answer")}</a>` : "") +
      `</div>`).join("");
  openPop("notes", s.id, html, el);
}
</script>
